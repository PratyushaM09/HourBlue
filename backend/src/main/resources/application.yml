server:
  port: ${PORT:8080}

spring:
  application:
    name: hourblue-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/hourblue}
    username: ${DB_USERNAME:hourblue}
    password: ${DB_PASSWORD:hourblue}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # Flyway owns the schema - Hibernate should only validate it, never auto-generate/alter.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

hourblue:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-string-in-your-env-file-min-32-bytes}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000} # 1 hour
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}

logging:
  level:
    com.hourblue: INFO
    org.springframework.security: INFO
